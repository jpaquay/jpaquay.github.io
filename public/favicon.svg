<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF205"/>
      <stop offset="100%" stop-color="#00ff66"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#FFF205" stroke-width="2.5" stroke-opacity="0.85"/>
  <!-- Corner Tech Accent Dots -->
  <circle cx="14" cy="14" r="2.2" fill="#FFF205" opacity="0.4"/>
  <circle cx="50" cy="14" r="2.2" fill="#00e5ff" opacity="0.4"/>
  <!-- Terminal Prompt Slash & Chevron: > / -->
  <path d="M14 22L25 32L14 42" fill="none" stroke="url(#neon)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M37 44L47 20" fill="none" stroke="#00e5ff" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Pulse Dot -->
  <circle cx="49" cy="42" r="3.2" fill="#FFF205" filter="url(#glow)"/>
</svg>
